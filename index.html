            </div>

                        <li class="nav__item">

            <a href="index.html"><img class="image" src="img/logo.svg"></a>
            <div class="rose">
                <img id="img1" src="https://cdn.jsdelivr.net/gh/AnnaLafleur/Florist@main/img/animation/main rose/0001.png">
                <div class="data-container-1">
                    <div id="text"></div>
                    <span class="btn">
                        <p>Вы можете составить букет цветов в специальном редакторе:</p>
                        <button class="learn-more-1">
                            <a href="creator.html">
                                <span class="circle" aria-hidden="true">
                                    <span class="icon arrow"></span>
                                </span>
                                <span class="button-text">Создать букет</span>
                            </a>
                        </button>
                    </span>
                    <div class="book">
                        <img id="img2" src="https://cdn.jsdelivr.net/gh/AnnaLafleur/Florist@main/img/animation/book/0001.png">
                        <div class="data-container-2">
                            <span class="btn">
                                <p>В справочнике представлены цветы, которые чаще всего используют во флористике. Вы можете ознакомиться с ними подробнее:</p>
                                <button class="learn-more-2">
                                    <a href="directory.html">
                                        <span class="circle" aria-hidden="true">
                                            <span class="icon arrow"></span>
                                        </span>
                                        <span class="button-text">Перейти к каталогу</span>
                                    </a>
                                </button>
                            </span>
                        </div>
                    </div>

            <!-- Подключение файлов js -->
            <script>
                window.onload = function () {
                    document.body.classList.add('loaded_hiding');
                    window.setTimeout(function () {
                        document.body.classList.add('loaded');
                        document.body.classList.remove('loaded_hiding');
                    }, 500);
                }
            </script>
            <!-- Загрузка -->
            <script>
            var animations = [
              {
                id: "img1",
                folder: "main rose",
                frameCount: 120,
                interval: 60,
                images: [],
                loadedImages: 0,
                currentFrame: 0
              },
              {
                id: "img2",
                folder: "book",
                frameCount: 150,
                interval: 60,
                images: [],
                loadedImages: 0,
                currentFrame: 0
              }
            ];

            // Генерация путей к изображениям для всех анимаций
            animations.forEach(anim => {
              for (var i = 1; i <= anim.frameCount; i++) {
                var frameNumber = String(i).padStart(4, '0');
                var src = `https://cdn.jsdelivr.net/gh/AnnaLafleur/Florist@main/img/animation/${anim.folder}/${frameNumber}.png`;
                anim.images.push(src);
              }
            });

            // Универсальная функция предзагрузки
            function preloadImages(anim) {
              anim.images.forEach((src) => {
                const img = new Image();
                img.src = src;
                img.onload = () => {
                  anim.loadedImages++;
                  if (anim.loadedImages === anim.images.length) {
                    console.log(`Все изображения для ${anim.folder} загружены!`);
                    setInterval(() => animate(anim), anim.interval);
                  }
                };
              });
            }

            // Универсальная функция анимации
            function animate(anim) {
              document.getElementById(anim.id).src = anim.images[anim.currentFrame];
              anim.currentFrame++;
              if (anim.currentFrame === anim.images.length) {
                anim.currentFrame = 0;
              }
            }

            // Запуск предзагрузки для всех анимаций
            animations.forEach(preloadImages);
            </script>
            <!-- Покадровая анимация -->
            <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>
            <script src="js/title.js"></script>
            <script src="js/transition.js"></script>
            <script src="js/selection.js"></script>
        </body>
</html>
