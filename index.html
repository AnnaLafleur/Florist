        <!-- SVG Background -->
        <svg preserveAspectRatio="xMidYMid slice" viewBox="10 10 80 80">
            <defs>
                <style>
                    @keyframes rotate {
                        0% {
                            transform: rotate(0deg);
                        }
                        100% {
                            transform: rotate(360deg);
                        }
                    }
                    .out-top {
                        animation: rotate 40s linear infinite; /* Slowed from 20s to 40s */
                        transform-origin: 13px 25px;
                    }
                    .in-top {
                        animation: rotate 20s linear infinite; /* Slowed from 10s to 20s */
                        transform-origin: 13px 25px;
                    }
                    .out-bottom {
                        animation: rotate 50s linear infinite; /* Slowed from 25s to 50s */
                        transform-origin: 84px 93px;
                    }
                    .in-bottom {
                        animation: rotate 30s linear infinite; /* Slowed from 15s to 30s */
                        transform-origin: 84px 93px;
                    }
                </style>
            </defs>
            <path fill="#ffb3a0" class="out-top" d="M37-5C25.1-14.7,5.7-19.1-9.2-10-28.5,1.8-32.7,31.1-19.8,49c15.5,21.5,52.6,22,67.2,2.3C59.4,35,53.7,8.5,37-5Z"/>
            <path fill="#ffa089" class="in-top" d="M20.6,4.1C11.6,1.5-1.9,2.5-8,11.2-16.3,23.1-8.2,45.6,7.4,50S42.1,38.9,41,24.5C40.2,14.1,29.4,6.6,20.6,4.1Z"/>

            <path fill="#ffece7" class="in-bottom" d="M102,67.1c-9.6-6.1-22-3.1-29.5,2-15.4,10.7-19.6,37.5-7.6,47.8s35.9,3.9,44.5-12.5C115.5,92.6,113.9,74.6,102,67.1Z"/>
        </svg>

            <!-- Подключение файлов js -->
            <script>
                history.scrollRestoration = 'manual';
                window.onload = function () {
                    document.body.classList.add('loaded_hiding');
                    window.setTimeout(function () {
                        document.body.classList.add('loaded');
                        document.body.classList.remove('loaded_hiding');
                    }, 500);
                }
            </script>
            <!-- Загрузка -->
            <script>
            var animations = [
              {
                id: "img1",
                folder: "main rose",
                frameCount: 120,
                interval: 60,
                images: [],
                loadedImages: 0,
                currentFrame: 0
              },
              {
                id: "img2",
                folder: "book",
                frameCount: 150,
                interval: 60,
                images: [],
                loadedImages: 0,
                currentFrame: 0
              }
            ];

            // Генерация путей к изображениям для всех анимаций
            animations.forEach(anim => {
              for (var i = 1; i <= anim.frameCount; i++) {
                var frameNumber = String(i).padStart(4, '0');
                var src = `https://cdn.jsdelivr.net/gh/AnnaLafleur/Florist@main/img/animation/${anim.folder}/${frameNumber}.png`;
                anim.images.push(src);
              }
            });

            // Универсальная функция предзагрузки
            function preloadImages(anim) {
              anim.images.forEach((src) => {
                const img = new Image();
                img.src = src;
                img.onload = () => {
                  anim.loadedImages++;
                  if (anim.loadedImages === anim.images.length) {
                    console.log(`Все изображения для ${anim.folder} загружены!`);
                    setInterval(() => animate(anim), anim.interval);
                  }
                };
              });
            }

            // Универсальная функция анимации
            function animate(anim) {
              document.getElementById(anim.id).src = anim.images[anim.currentFrame];
              anim.currentFrame++;
              if (anim.currentFrame === anim.images.length) {
                anim.currentFrame = 0;
              }
            }

            // Запуск предзагрузки для всех анимаций
            animations.forEach(preloadImages);
            </script>
            <!-- Покадровая анимация -->
            <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>
            <script src="js/title.js"></script>
