                        }

                        animation: rotate 40s linear infinite; /* Slowed from 20s to 40s */

                    }

        <!-- Основной контейнер для этапов -->
        <div class="creator-container">
            <!-- Первый этап -->
            <div class="step step-1 active">
                <div class="step-content">
                    <!-- Левая часть -->
                    <div class="left-section">
                        <div class="step-1 active">
                            <div class="left-section">
                                <div class="ribbon-animation-container">
                                    <img id="ribbon-animation" src="https://cdn.jsdelivr.net/gh/AnnaLafleur/Florist@main/img/animation/ribbon/0001.png" alt="Ribbon animation">
                                </div>
                            </div>
                        </div>
                        <h2>Выберите размер букета:</h2>
                        <div class="counter-container">
                            <p>В букете будет</p>
                            <div class="stepper-wrap">
                                <div class="stepper">
                                    <div class="count"></div>
                                </div>
                                <button class="arrow-btn arrow-top" aria-label="Увеличить"></button>
                                <button class="arrow-btn arrow-bottom" aria-label="Уменьшить"></button>
                            </div>
                            <p>цветов.</p>
                        </div>
                    </div>
                    <!-- Правая часть (50%) -->
                    <div class="right-section">
                        <h2>Форма букета:</h2>
                        <div class="bouquet-form">
                            <div class="form-container">
                                <button class="arrow-btn arrow-left" aria-label="Предыдущая форма" hidden></button>
                                <div class="form-display">
                                    <div class="form-circle form-shape active"></div>
                                    <div class="form-square form-shape"></div>
                                    <div class="form-rectangle form-shape"></div>
                                </div>
                                <button class="arrow-btn arrow-right" aria-label="Следующая форма"></button>
                            </div>
                        </div>
                    </div>
                    <!-- Кнопка "Далее" -->
                    <div class="next-button">
                        <button class="learn-more-1 next-btn-short">
                            <span class="circle" aria-hidden="true">
                                <span class="icon arrow"></span>
                            </span>
                            <span class="button-text">Продолжить</span>
                        </button>
                    </div>
                </div>
            </div>

        <script>
            window.onload = function () {
                document.body.classList.add('loaded_hiding');
                window.setTimeout(function () {
                    document.body.classList.add('loaded');
                    document.body.classList.remove('loaded_hiding');
                }, 500);
            }
        </script>
        <!-- Загрузка -->
        <script>
            if (document.querySelector('.step-1.active')) {
                var ribbonAnimation = {
                    id: "ribbon-animation",
                    frameCount: 35,
                    interval: 70,
                    images: [],
                    loadedImages: 0,
                    currentFrame: 0
                };

                // Генерация путей к изображениям
                for (var i = 1; i <= ribbonAnimation.frameCount; i++) {
                    var frameNumber = String(i).padStart(4, '0');
                    var src = `https://cdn.jsdelivr.net/gh/AnnaLafleur/Florist@main/img/animation/ribbon/${frameNumber}.png`;
                    ribbonAnimation.images.push(src);
                }

                // Предзагрузка изображений
                function preloadRibbonImages() {
                    ribbonAnimation.images.forEach((src) => {
                        const img = new Image();
                        img.src = src;
                        img.onload = () => {
                            ribbonAnimation.loadedImages++;
                            if (ribbonAnimation.loadedImages === ribbonAnimation.images.length) {
                                setInterval(() => animateRibbon(), ribbonAnimation.interval);
                            }
                        };
                    });
                }

                // Функция анимации
                function animateRibbon() {
                    var imgElement = document.getElementById(ribbonAnimation.id);
                    if (imgElement) {
                        imgElement.src = ribbonAnimation.images[ribbonAnimation.currentFrame];
                        ribbonAnimation.currentFrame++;
                        if (ribbonAnimation.currentFrame === ribbonAnimation.images.length) {
                            ribbonAnimation.currentFrame = 0;
                        }
                    }
                }

                // Запуск предзагрузки
                preloadRibbonImages();
            }
        </script>
        <script>
            document.addEventListener('DOMContentLoaded', function() {
                // Функция для обновления класса body
                function updateBodyClass() {
                    const activeStep = document.querySelector('.step.active');
                    if (activeStep && activeStep.classList.contains('step-2')) {
                        document.body.classList.add('step-2-active');
                    } else {
                        document.body.classList.remove('step-2-active');
                    }
                }

                // Вызываем при загрузке
                updateBodyClass();

                // Наблюдаем за изменениями в DOM (если этапы переключаются без перезагрузки)
                const observer = new MutationObserver(function(mutations) {
                    mutations.forEach(function(mutation) {
                        if (mutation.attributeName === 'class') {
                            updateBodyClass();
                        }
                    });
                });

                // Начинаем наблюдение за .creator-container
                const container = document.querySelector('.creator-container');
                if (container) {
                    observer.observe(container, {
                        attributes: true,
                        subtree: true,
                        attributeFilter: ['class']
                    });
                }

                // Если у вас есть кнопки переключения этапов, можно добавить обработчики:
                const nextButtons = document.querySelectorAll('.next-btn-short');
                const backButtons = document.querySelectorAll('.back-btn-short');

                nextButtons.forEach(btn => btn.addEventListener('click', updateBodyClass));
                backButtons.forEach(btn => btn.addEventListener('click', updateBodyClass));
            });
        </script>
        <script>
            document.addEventListener('DOMContentLoaded', () => {
                const directoryItems = document.querySelectorAll('.directory-item');

                directoryItems.forEach(item => {
                    const input = item.querySelector('.item-content__input[type="radio"]');
                    const content = item.querySelector('.item-content');

                    content.addEventListener('click', (e) => {
                        // Предотвращаем стандартное поведение радиокнопки и фокус
                        e.preventDefault();
                        input.focus({ preventScroll: true }); // Предотвращаем прокрутку при фокусе

                        // Если ячейка уже выбрана, снимаем выделение
                        if (input.checked) {
                            input.checked = false;
                            content.classList.remove('selected');
                        } else {
                            // Снимаем класс selected со всех ячеек
                            document.querySelectorAll('.directory-item .item-content').forEach(otherContent => {
                                otherContent.classList.remove('selected');
                            });
                            // Устанавливаем выбор для текущей ячейки
                            input.checked = true;
                            content.classList.add('selected');
                        }
                    });
                });
            });
        </script>

                function updateBackgroundWidth() {
                    const grids = [
                        document.querySelector('.step-2 .right-section .directory-grid'),
                        document.querySelector('.step-3 .right-section .directory-grid')
                    ];

                    grids.forEach(grid => {
                        if (!grid) return;

                        const rightSection = grid.closest('.right-section');
                        if (!rightSection) return;

                        const cellWidth = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--cell-width')) || 240; // Default to 240px
                        const columnGap = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--column-gap')) || 15; // Default to 15px
                        const extraPadding = 100; // Match step-2's extra padding

                        // Temporarily set grid to auto width to calculate natural column count
                        rightSection.style.width = 'auto';
                        grid.style.width = '100%'; // Ensure grid takes full available space

                        // Force layout recalculation
                        grid.offsetWidth;

                        // Calculate available width for the grid (accounting for padding)
                        const availableWidth = window.innerWidth * 0.45 - 80; // Match max-width: 45vw and padding (30px + 50px)
                        const columns = Math.max(1, Math.floor((availableWidth + columnGap) / (cellWidth + columnGap)));

                        // Set the grid-template-columns explicitly to ensure consistent columns
                        grid.style.gridTemplateColumns = `repeat(${columns}, ${cellWidth}px)`;

                        // Calculate and set the right-section width
                        const totalWidth = columns * cellWidth + (columns - 1) * columnGap + extraPadding;
                        rightSection.style.width = `${totalWidth}px`;
                    });
                }

                // Initial calculation
                updateBackgroundWidth();

                // Recalculate on window resize
                window.addEventListener('resize', updateBackgroundWidth);

                // Recalculate when step-2 or step-3 becomes active
                const observer = new MutationObserver(() => {
                    if (document.querySelector('.step-2.active') || document.querySelector('.step-3.active')) {
                        updateBackgroundWidth();
                    }
                });

                observer.observe(document.body, {
                    attributes: true,
                    subtree: true,
                    attributeFilter: ['class']
                });
            });
        </script>
