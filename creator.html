        <!-- Основной контейнер для этапов -->
        <div class="creator-container">
            <!-- Первый этап -->
            <div class="step step-1 active">
                <div class="step-content">
                    <!-- Левая часть -->
                    <div class="left-section">
                        <div class="step-1 active">
                            <div class="left-section">
                                <div class="ribbon-animation-container">

                            </div>
                        </div>
                        <h2>Выберите размер букета:</h2>
                        <div class="counter-container">
                            <p>В букете будет</p>
                            <div class="stepper-wrap">
                                <div class="stepper">
                                    <div class="count"></div>
                                </div>

                                <button class="arrow-btn arrow-bottom" aria-label="Уменьшить"></button>
                            </div>
                            <p>цветов.</p>
                        </div>
                    </div>
                    <!-- Правая часть (50%) -->
                    <div class="right-section">
                        <h2>Форма букета:</h2>
                        <div class="bouquet-form">
                            <div class="form-container">
                                <button class="arrow-btn arrow-left" aria-label="Предыдущая форма" hidden></button>
                                <div class="form-display">
                                    <div class="form-circle form-shape active"></div>
                                    <div class="form-square form-shape"></div>

                                    <div class="form-rectangle form-shape"></div>

                    <!-- Кнопка "Далее" -->

                        <button class="learn-more-1 next-btn-short">
                            <span class="circle" aria-hidden="true">

                            </span>
                            <span class="button-text">Продолжить</span>
                        </button>
                    </div>
                </div>
            </div>

            <!-- Второй этап -->
            <div class="step step-2">
                <div class="step-content">
                    <!-- Кнопка "Назад" -->
                    <div class="back-button">

                        <h2>Оформление заказа:</h2>
                        <!-- ... ваш контент ... -->

        <script>
            window.onload = function () {
                document.body.classList.add('loaded_hiding');
                window.setTimeout(function () {
                    document.body.classList.add('loaded');
                    document.body.classList.remove('loaded_hiding');
                }, 500);
            }
        </script>
        <!-- Загрузка -->
        <script>
        if (document.querySelector('.step-1.active')) {
            var ribbonAnimation = {
                id: "ribbon-animation",
                frameCount: 35,
                interval: 70,
                images: [],
                loadedImages: 0,
                currentFrame: 0
            };

            // Генерация путей к изображениям
            for (var i = 1; i <= ribbonAnimation.frameCount; i++) {
                var frameNumber = String(i).padStart(4, '0');
                var src = `https://cdn.jsdelivr.net/gh/AnnaLafleur/Florist@main/img/animation/ribbon/${frameNumber}.png`;
                ribbonAnimation.images.push(src);
            }

            // Предзагрузка изображений
            function preloadRibbonImages() {
                ribbonAnimation.images.forEach((src) => {
                    const img = new Image();
                    img.src = src;
                    img.onload = () => {
                        ribbonAnimation.loadedImages++;
                        if (ribbonAnimation.loadedImages === ribbonAnimation.images.length) {
                            console.log('Все изображения ribbon загружены!');
                            setInterval(() => animateRibbon(), ribbonAnimation.interval);
                        }
                    };
                });
            }

            // Функция анимации
            function animateRibbon() {
                var imgElement = document.getElementById(ribbonAnimation.id);
                if (imgElement) {
                    imgElement.src = ribbonAnimation.images[ribbonAnimation.currentFrame];
                    ribbonAnimation.currentFrame++;
                    if (ribbonAnimation.currentFrame === ribbonAnimation.images.length) {
                        ribbonAnimation.currentFrame = 0;
                    }
                }
            }

            // Запуск предзагрузки
            preloadRibbonImages();
        }
        </script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>
